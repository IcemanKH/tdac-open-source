# 公开构建工作流（G1 最终修复 / P1-05；G2 最小发布工程补丁：补上发行 ZIP 及其 SHA-256）
#
# 目的：把“构建来源”写成可复现、可追溯的公开流程：
#   测试 → 语法自检 → 干净发布暂存目录 + 脱敏扫描 → 便携版构建
#   → 由**本次**产物打包发行 ZIP + ZIP 的 SHA-256 + 逐文件回读复核 → SHA-256 清单
#   → 上传公开构建证据。
#
# 边界（务必保持）：
#   * 只做构建与产物哈希，**不**创建 / 推送 Release，**不**上传任何用户资料；
#   * 不使用任何仓库 Secret；构建过程不接触用户数据目录；
#   * 与本地脚本（build_portable.py、tools/make_release_zip.py）使用**同一个** Python 版本（3.12）；
#   * 发行 ZIP **只在同一次 CI 构建内**由该次 onedir 产物现场打包，绝不从开发机上传现成 ZIP
#     （Windows 上无 7z/压缩工具依赖，仅用 Python 标准库 zipfile）。
#   * 本工作流**未**在远端执行过（仓库尚未创建）：远程 CI 状态应标记为 NOT VERIFIED。
#
# 说明：本仓库当前未创建、也未公开。本文件仅描述构建流程，
#       在获得另行明确授权之前不会被触发，也不会推送任何产物。
name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test-and-package:
    name: Windows x64 测试与便携版构建
    runs-on: windows-latest
    steps:
      - name: 检出源码
        # v4.2.2；固定到完整提交，避免可变 tag 在未审阅时改变构建输入。
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: 安装 Python 3.12（与本地构建环境一致）
        # v5.6.0；固定到完整提交。
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: 安装锁定依赖（运行时 + 构建期）
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock.txt

      - name: 运行全部离线单元测试
        run: python -m unittest discover -s tests -t .

      - name: 源码语法自检
        run: >
          python -m py_compile
          tdac_app.py tdac_fill.py tdac_gui.py tdac_paths.py tdac_privacy.py
          tdac_sec.py tdac_validate.py tdac_draft.py tdac_gate.py tdac_group.py
          tdac_synth.py tdac_browser.py tdac_update.py tdac_diag.py build_portable.py
          tools/prepare_release.py tools/make_release_zip.py

      - name: 离线演练（不启动浏览器、不触网）
        run: python tdac_fill.py --dry-run

      - name: 生成干净发布暂存目录并做脱敏扫描
        run: python tools/prepare_release.py

      - name: 构建便携版（输出 BUILD_INFO.json 与 SHA256SUMS.txt）
        run: python build_portable.py
        env:
          TDAC_BUILD_SOURCE_SHA: ${{ github.sha }}

      - name: 由本次产物打包发行 ZIP 并输出 ZIP 的 SHA-256
        # 命名与 README 约定一致：TDAC填写助手-<版本>-windows-x64.zip（+ 同名 .sha256）。
        # 脚本会核对 BUILD_INFO/SHA256SUMS 与磁盘一致后，才写出 ZIP 与校验文件。
        run: python tools/make_release_zip.py
        env:
          TDAC_BUILD_SOURCE_SHA: ${{ github.sha }}

      - name: 复核 ZIP 内容与本次构建产物逐文件一致
        # 独立一步再回读 ZIP：文件条目集合 == onedir + BUILD_INFO + SHA256SUMS，
        # 且逐条目内容哈希与磁盘一致、vcs.commit == 本次提交 SHA。
        run: python tools/make_release_zip.py --verify
        env:
          TDAC_BUILD_SOURCE_SHA: ${{ github.sha }}

      - name: 记录 ZIP 与构建元数据摘要（构建证据）
        shell: pwsh
        run: |
          $info = Get-Content -LiteralPath ".build/dist/BUILD_INFO.json" -Raw -Encoding utf8 | ConvertFrom-Json
          $zip  = ".build/dist/TDAC填写助手-$($info.appVersion)-windows-x64.zip"
          $side = "$zip.sha256"
          if (-not (Test-Path -LiteralPath $side)) { throw "缺少 ZIP 校验文件：$side" }
          $declared = ((Get-Content -LiteralPath $side -Raw -Encoding utf8) -split '\s+')[0]
          $actual   = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $declared.ToLower()) { throw "ZIP 的 SHA-256 与校验文件不一致" }
          $lines = @(
            "## 便携版构建摘要",
            "",
            "| 项 | 值 |",
            "|---|---|",
            "| 应用版本 | $($info.appVersion) |",
            "| 构建提交 | $($info.vcs.commit) |",
            "| ZIP | $(Split-Path -Leaf $zip) |",
            "| ZIP 大小 | $((Get-Item -LiteralPath $zip).Length) 字节 |",
            "| ZIP SHA-256 | $actual |",
            "| EXE SHA-256 | $($info.artifact.exeSha256) |",
            "| 构建环境 | Python $($info.pythonVersion) / PyInstaller $($info.pyinstallerVersion) |"
          )
          $lines | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: 上传构建产物（ZIP + ZIP 校验文件 + 构建元数据 + 公开源码集合）
        # v4.6.2；固定到完整提交。
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TDAC-portable-windows-x64
          path: |
            .build/dist/TDAC填写助手/
            .build/dist/TDAC填写助手-*-windows-x64.zip
            .build/dist/TDAC填写助手-*-windows-x64.zip.sha256
            .build/dist/SHA256SUMS.txt
            .build/dist/BUILD_INFO.json
            release/
          if-no-files-found: error
